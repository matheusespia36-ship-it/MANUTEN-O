services:
  - type: web
    name: painel-manutencao-qha
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PUBLIC_FILE_ID
        sync: false   # preencha no painel do Render
      - key: APPS_SCRIPT_URL
        sync: false   # opcional
      - key: SECRET_KEY
        generateValue: true
      - key: USERS_SYNC_TOKEN
        sync: false   # mesmo texto do USERS_SYNC_TOKEN no Apps Script
